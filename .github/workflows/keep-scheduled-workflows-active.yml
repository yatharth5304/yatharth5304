name: Keep Scheduled Workflows Active

on:
  schedule:
    # GitHub may disable schedules in public repos after 60 days without repository activity.
    # Refresh this small timestamp file twice per month to keep the scheduled Render workflow active.
    - cron: "7 0 1,15 * *"

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4

      - name: Update scheduler heartbeat
        shell: bash
        run: |
          set -euo pipefail
          date -u '+Last scheduler heartbeat: %Y-%m-%dT%H:%M:%SZ' > .github/schedule-heartbeat.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/schedule-heartbeat.txt
          if git diff --cached --quiet; then
            echo "Heartbeat file is unchanged."
            exit 0
          fi
          git commit -m "chore: refresh scheduled workflow heartbeat"
          git push
